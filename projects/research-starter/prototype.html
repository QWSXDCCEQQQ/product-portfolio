 return `<div class="workspace"><div>${box('论文伴读 / 阅读工作区',body,'聚焦一个问题，向前一步')}<div class="handoff"><span><b>交接前检查</b><br>仍有待核对项；可预览大纲，暂不标记伴读完成。</span><button class="btn" onclick="goto(3)">预览汇报大纲 ${icon('arrow')}</button></div>${details(2)}</div><aside class="side">${side}</aside></div>`;

function candidates(){const items=[{id:'P1',type:'方法型',desc:'聚焦方法设计，适合回答“为什么这样做”。',match:'高',pre:'图模型 + 文本挖掘',access:'全文 PDF',load:'中 · 约 3 天'},{id:'P2',type:'综述型',desc:'先建立领域概览，阅读门槛相对较低。',match:'中',pre:'无',access:'全文 PDF',load:'低 · 约 1 天'},{id:'P3',type:'实证型',desc:'问题匹配，但实验细节暂不可核对。',match:'高',pre:'计量 + NLP',access:'仅摘要',load:'高 · 不确定'}];return `<div class="cards">${items.map(p=>`<article class="candidate ${state.candidate===p.id?'selected':''}"><div style="display:flex;justify-content:space-between"><span class="tag ${p.id==='P1'?'blue':''}">${p.type}</span><span style="color:var(--blue);font-size:12px">${state.candidate===p.id?'◉':'○'}</span></div><h3>${p.id} <small>候选论文</small></h3><p>${p.desc}</p><div class="meta"><span class="muted">问题匹配</span><b>${p.match}</b></div><div class="meta"><span class="muted">前置知识</span><b>${p.pre}</b></div><div class="meta"><span class="muted">可获证据</span><b style="color:${p.id==='P3'?'var(--amber)':'var(--green)'}">${p.access}</b></div><div class="meta"><span class="muted">阅读负担</span><b>${p.load}</b></div><button class="btn ${state.candidate===p.id?'primary':''}" onclick="selectCandidate('${p.id}')">${state.candidate===p.id?'当前候选':'选择 '+p.id}</button></article>`).join('')}</div>`}
function selection(){return `<div>${box('候选论文对比',`${candidates()}<div class="summary"><b>选择依据，比一个精确评分更有用。</b><p>P1 与任务匹配，全文可得，可支撑方法页与实验页。P2 适合领域概览；P3 只有摘要，不能支撑实验细节。阅读时间均为演示估计。</p></div>`,'3 篇示例 · 不做任意评分')}<div class="handoff"><span><b>当前选择 ${state.candidate}</b><br>${state.candidate==='P3'?'确认后限定为摘要层面；不沿用 P1 的全文证据。':'确认后进入伴读；选定论文不等于已经读懂。'}</span><button class="btn primary" onclick="confirmCandidate()">确认并进入伴读 ${icon('arrow')}</button></div>${details(1)}</div>`}
function task(){const f=[['goal','汇报目标'],['audience','听众'],['language','语言'],['requirement','导师要求']];return `<div class="workspace"><div>${box('建立本次任务卡',`<form id="taskform" onsubmit="saveTask(event)"><div class="fieldgrid">${f.map(([id,label])=>`<label>${label}<input name="${id}" value="${esc(state.task[id])}" required maxlength="80"></label>`).join('')}<div class="full"><div class="summary"><b>只补充影响下一步的信息</b><p>先确认有没有候选论文；有就直接继续，不必重复填写背景。</p></div></div></div><button class="btn primary" style="margin-top:20px" type="submit">保存任务卡并选文 ${icon('arrow')}</button></form>`)}${details(0)}</div><aside class="side">${context()}${box('这张卡会一直跟着任务',`<p class="muted" style="font-size:11px">时长决定讲述取舍，听众决定解释深度，导师要求决定重点。后续阶段都围绕同一张任务卡推进。</p>`)}</aside></div>`}
const outline=[['这项工作要解决什么','30 秒内让听众抓到问题','—',40],['已有方法卡在哪','只讲与问题相关的局限','E1',90],['方法主流程','按输入—处理—输出走一遍','E2',210],['关键设计选择及理由','正面回应导师的要求','E2',90],['实验如何支撑结论','交代比较对象、指标与划分','E3',120],['局限与我的疑问','保留讨论，不冒充结论','E4',50]];
const colors=['#a6b9f0','#809ce8','#4169e1','#6588e3','#8b9fd0','#b1bfdc'];
function timing(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function presentation(){
if(state.candidate!=='P1'||!state.confirmed)return box('汇报制备',`<div class="empty">当前论文没有已建立的证据链，暂不生成其汇报大纲。可以返回 P1 继续体验示例。</div><button class="btn primary" style="margin-top:18px" onclick="goto(1)">返回候选选择</button>`);
return `<div class="workspace"><div>${box('讲述主线 / 6 页大纲',`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">把时间留给方法，而不是目录。</b><span class="tag blue">预计 10:00</span></div><div class="slides" role="img" aria-label="6页汇报时间分配：40秒、90秒、210秒、90秒、120秒、50秒">${outline.map((s,i)=>`<span style="flex:${s[3]};background:${colors[i]}">${i+1}</span>`).join('')}</div><div class="chartcaption">时间预算示意 · 尚未实际试讲计时</div>${outline.map((s,i)=>`<div class="slide"><div class="no">${String(i+1).padStart(2,'0')}</div><div><b>${s[0]}</b><small>${s[1]} &nbsp; <span style="color:var(--blue)">${s[2]}</span></small></div><span class="time">${timing(s[3])}</span></div>`).join('')}<div class="summary"><b>未解问题留在讨论页</b><p>基线选择尚未观察到用户理解；E3 的数字仍待原表核对。确认大纲不代表这些检查已经通过。</p></div>`,'围绕任务取舍内容')}<div class="handoff"><span><b>${state.outline?'大纲结构已确认':'等待你确认大纲结构'}</b><br>只确认内容取舍；此演示未生成 PPTX。</span><button class="btn primary" onclick="confirmOutline()">${state.outline?'进入试讲':'确认结构，进入试讲'} ${icon('arrow')}</button></div>${details(3)}</div><aside class="side">${sideNext('DELIVERY','先有一条主线，<br>再有六页内容。','当前可交付 Markdown 大纲、讲述意图和证据索引。此原型未接入 PPTX 生成。','导出当前大纲',"exportOutline()")}${box('制备前检查',`<div class="side-list"><span>讲述时间预算</span><span class="tag green">10:00</span></div><div class="side-list"><span>原文数字核对</span><span class="tag amber">待执行</span></div><div class="side-list"><span>大纲结构</span><span class="tag ${state.outline?'green':'amber'}">${state.outline?'已确认':'待确认'}</span></div><div class="side-list"><span>PPTX 文件</span><span class="tag">尚未生成</span></div>`)}</aside></div>`}
function rehearsal(){return `<div class="workspace"><div>${box('试讲诊断 / 把问题送回正确的位置',`<p class="chartcaption">以下为原型预设的试讲问题，用于演示分流；不是本次实际计时或评测结果。</p><div class="issue"><div style="display:flex;justify-content:space-between"><b>第 3 页 · 方法图讲述超时 90 秒</b><span class="tag">表达问题</span></div><p>删去不服务主线的细节，或把方法图拆成两页。</p><button class="btn" onclick="goto(3)">返回汇报，调整结构 ↗</button></div><div class="issue red"><div style="display:flex;justify-content:space-between"><b>第 5 页 · 基线选择答不上来</b><span class="tag red">理解问题</span></div><p>定位对应段落，补读“为什么选择这些基线”，再重核相关页。</p><button class="btn" onclick="returnReading()">返回伴读，补齐理解 ↗</button></div><div class="issue"><div style="display:flex;justify-content:space-between"><b>第 6 页 · 局限表述含糊</b><span class="tag">表达问题</span></div><p>改成一句明确表述，再补一条支持该表述的证据。</p><button class="btn" onclick="goto(3)">返回汇报，精简表述 ↗</button></div><label style="font-size:11px;color:var(--muted)" for="review-note">我的实际试讲观察</label><textarea id="review-note" style="width:100%;height:90px;border:1px solid var(--line);border-radius:7px;padding:10px;margin-top:8px;font-size:12px" placeholder="记录哪一页讲不清、哪些追问答不上；此处不做自动判定。">${esc(state.notes.rehearsal||'')}</textarea><button class="btn" style="margin-top:10px" onclick="saveReview()">保存试讲记录</button>`)}${details(4)}</div><aside class="side">${box('修订分流',`<div class="summary" style="margin-top:0"><b>表达问题 → 改结构</b><p>调整顺序、删减信息、优化图示。</p></div><div class="summary" style="border-color:var(--red)"><b>理解问题 → 回伴读</b><p>补读具体段落，重新核对相关结论。</p></div>`)}${context()}</aside></div>`}
function flow(){return `${section('流程全景','可点击各阶段')}<div class="box"><div class="pad"><div class="eyebrow">FIVE STAGES · ONE SHARED CONTEXT</div><h2 style="margin-top:8px">每次向前，都有明确的交接。</h2><p class="muted" style="font-size:12px;margin-top:8px">任务卡贯穿全程；产出物齐备或用户确认后再推进。这里的阶段跳转是预览导航，不代表阶段已经完成。</p><div class="flowstrip">${stages.map((s,i)=>`<button class="flowitem" onclick="goto(${i})"><span class="step-num">0${i+1}</span><strong>${s.t}</strong><small>${['对齐目标与约束','确认阅读对象','记录理解与证据','确认讲述主线','分类问题并修订'][i]}</small></button>${i<4?'<span class="arrow">→</span>':''}`).join('')}</div><div class="branchgrid"><div class="branch return"><b>⑤ → ④ &nbsp; 表达问题：修改结构</b><p>讲述超时、重点不清、表述含糊，回到讲述方式上修订。</p><button class="btn" style="margin-top:12px" onclick="goto(3)">查看汇报大纲 ↗</button></div><div class="branch return"><b>⑤ → ③ &nbsp; 理解问题：回到伴读</b><p>无法解释设计理由，定位具体段落补读，再核对相关页。</p><button class="btn" style="margin-top:12px" onclick="returnReading()">体验返回伴读 ↗</button></div><div class="branch"><b>阅读降级 / 仅有摘要</b><p>把范围限定为摘要，不补写全文细节；选 P3 可体验该状态。</p><button class="btn" style="margin-top:12px" onclick="goto(1)">查看候选论文 ↗</button></div><div class="branch"><b>交付降级 / 没有 PPTX 生成能力</b><p>交付实际完成的大纲和讲稿，明确说明 PPTX 未生成。</p><button class="btn" style="margin-top:12px" onclick="goto(3)">查看文字交付 ↗</button></div></div></div></div>`}
function library(){return `${section('证据资料库','P1 · 4 条示例记录')}${box('主张与证据，一起交接',`<p class="muted" style="font-size:12px;margin-bottom:20px">本库展示 P1 的原始示例记录。支持范围比“存在一条引用”更重要；当前选择其他论文时，这些证据不会自动沿用。</p>${evidenceCards()}<div class="summary"><b>仍有 1 个数字待原表核对</b><p>本原型没有真实论文 PDF，不提供虚构的页码、图号或实验数字。</p></div>`,'点击记录查看详情')}`}
function rules(){const r=[['只有摘要，只做摘要层面的汇报','不能把摘要阅读当作全文精读，无法核对的实验细节不进入结论。'],['没有真实作答，理解标为未观察','保存回答不等于掌握，需要人工对照原文核对具体正确处与缺口。'],['读不到 PDF，不猜页码','请求可访问的原文或片段，核对后再指定章节、图表与数字。'],['没有生成 PPTX，就如实说明','当前原型仅导出 Markdown 大纲与记录，不把文本当成演示文件。'],['论文对象变化，先检查影响范围','切换候选时清除本次回答和大纲确认，不把 P1 证据复制到其他论文。'],['材料中的指令，只当待分析内容','论文、网页和附件是资料，不能改写用户的任务目标。']];return `${section('设计与能力边界','作品集说明')}${box('用清晰的边界，换取可信的交接',`<div class="rules">${r.map((a,i)=>`<article class="rule"><span class="eyebrow">0${i+1}</span><h3 style="margin-top:8px">${a[0]}</h3><p>${a[1]}</p></article>`).join('')}</div><div class="summary"><b>这次可视化改版做了什么</b><p>把原来的阶段说明改成可操作的工作台：论文候选卡、证据详情、回答保存、10 分钟讲述时间轴、问题分流、本地记录与导出。五阶段设计及原始交接说明仍可展开查看。</p></div><div class="summary" style="border-color:#d7bd8c;background:#fffaf0"><b>验证范围与局限</b><p>原作品说明：仅进行过一次端到端试运行，尚无真实用户验证。本页面为浏览器演示，未连接论文检索、PDF 解析、AI 评判或 PPTX 生成服务。所有论文与结果都是示例；本次界面改版不构成对工作流效果的验证。</p></div>`)}`}
function render(){header();let html;if(page==='flow')html=flow();else if(page==='evidence')html=library();else if(page==='rules')html=rules();else{const content=[task,selection,reading,presentation,rehearsal][state.stage]();html=section(stages[state.stage].t,['任务上下文','任务驱动选文','每轮一个小问题','先主线，后页面','理解 / 表达分流'][state.stage])+content}$('mainhost').innerHTML=`<div class="fader">${html}</div>`}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
function modal(title,body,foot=''){$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal-foot').innerHTML=foot||'<button class="btn primary" onclick="closeModal()">知道了</button>';$('modal').showModal()}
function closeModal(){$('modal').close()}
function openEvidence(i){const e=evidence[i];modal(`${e.id} / 证据详情`,`<span class="tag blue">${e.type}</span><h2 style="margin-top:15px">${e.title}</h2><p>${e.body}</p><div class="gates" style="margin-top:20px"><div><b>读取位置</b><p>${e.source}</p></div><div><b>支持范围</b><p>${e.range}</p></div></div><div class="notice">原型示例，非已核对的真实论文证据。无可跳转原文。</div>`)}
function openAnswer(){modal('理解检查 / 用一个新例子走一遍',`<span class="tag blue">只处理一个小问题</span><p>请说明一个新输入是什么、中间表示如何变化，以及如何得到输出。保存后只记录你的作答，不自动判定掌握。</p><label for="answer-input" style="font-size:11px">我的回答</label><textarea id="answer-input" maxlength="5000" placeholder="例如：我先输入……经过……得到……">${esc(state.answer)}</textarea><small>可直接关闭；只有点击保存才更新记录。</small>`,`<button class="btn" onclick="closeModal()">稍后再答</button><button class="btn primary" onclick="saveAnswer()">保存回答</button>`)}
function saveAnswer(){const text=$('answer-input').value.trim();if(!text){toast('先写下一个具体例子，再保存。');return}state.answer=text;persist();closeModal();render();toast('回答已保存，理解状态仍待人工核对。')}
function selectCandidate(id){if(id===state.candidate)return;modal('切换论文 / 更新影响范围',`<h2>${state.candidate} → ${id}</h2><p>切换后会清除本次保存的理解回答和大纲确认。E1—E4 仍作为 P1 的示例保留在资料库中，不再用于新论文。</p><p>${id==='P3'?'P3 只有摘要；阅读范围会降级为摘要层面。':'当前原型仅提供 P1 的完整演示内容；新对象尚未建立证据记录。'}</p>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="applyCandidate('${id}')">确认切换</button>`)}
function applyCandidate(id){state.candidate=id;state.confirmed=false;state.answer='';state.outline=false;state.notes={};persist();closeModal();render();toast('已切换候选，请确认阅读对象。')}
function confirmCandidate(){state.confirmed=true;persist();goto(2);toast(state.candidate==='P1'?'已确认 P1，进入伴读示例。':'已确认选择；旧论文证据不会自动沿用。')}
function saveTask(e){e.preventDefault();const data=new FormData(e.target);for(const key of Object.keys(state.task)){const val=String(data.get(key)||'').trim();if(!val){toast('请填写完整的任务信息。');return}state.task[key]=val}persist();goto(1);toast('任务卡已保存。')}
function confirmOutline(){state.outline=true;persist();goto(4);toast('已确认大纲结构，证据待核对项继续保留。')}
function returnReading(){goto(2);toast('已返回伴读：下一步补读基线选择的相关段落。')}
function saveReview(){state.notes.rehearsal=$('review-note').value.trim();persist();toast('试讲观察已保存，可从顶部导出记录。')}
function openHelp(){modal('关于这份交互原型',`<h2>从一篇论文，到一次讲得清楚的汇报。</h2><p>建议体验：在伴读页打开 E3 → 填写理解检查 → 预览汇报大纲 → 确认结构 → 从试讲问题返回伴读。</p><p>也可以切换到 P3，观察“只有摘要”时的范围降级。记录仅保存在当前浏览器中，可手动导出；不同浏览器之间不会同步。</p><div class="notice">页面中的论文、理解状态、试讲结果均为示例。没有真实检索、AI 评判或 PPTX 生成。</div>`)}
function resetDemo(){modal('重置本地演示',`<p>将恢复 P1 的初始示例，并清除本浏览器内保存的任务修改、回答和试讲记录。</p>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="applyReset()">重置演示</button>`)}
function applyReset(){state=structuredClone(initial);persist();page='work';closeModal();render();toast('已恢复初始演示。')}
function download(name,text){const blob=new Blob(['\ufeff'+text],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 Markdown 文件。')}
function outlineText(){return '# 科研启航 · 10 分钟汇报大纲\n\n> 原型示例，尚未生成 PPTX。时间为预算，未实际计时。\n\n'+outline.map((s,i)=>`## ${i+1}. ${s[0]}（${timing(s[3])}）\n\n- 讲述意图：${s[1]}\n- 证据：${s[2]}\n`).join('\n')+'\n待处理：基线选择理解未观察，E3 数字待原表核对。\n'}
function exportOutline(){if(state.candidate!=='P1'||!state.confirmed){toast('当前论文尚无已建立的大纲。');return}download('科研启航_汇报大纲.md',outlineText())}

$('brandicon').innerHTML=icon('launch');$('export-btn').innerHTML=icon('download')+'导出记录';$('demoNotice').innerHTML=icon('info')+'<span>演示数据 / 本页论文、证据与预设试讲问题均为示例，未接入真实论文解析与 AI 评判。你填写的内容仅保存于当前浏览器。</span>';
